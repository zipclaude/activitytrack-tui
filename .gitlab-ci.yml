# CI of activitytrack-tui on GitLab. No pipeline starts on its own (not on pushes, merge requests
# or tags): start one by hand ("Run pipeline" on a branch or tag) or with the pipelines API.
# The Linux jobs run on the owner's local runner (tag local, set in default below), free of
# charge. The Windows jobs (shared, paid runners) run only on a version tag, at the release.
# Started on a branch a pipeline tests and builds the Debian/Ubuntu packages and the tarball, and
# publishes nothing; started on a tag vX.Y.Z it also builds the Windows executable, tries everything
# and publishes the release. The library is python3-activitytrack at the tag in .gitlab/lib-ref.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

stages: [test, package, release]

default:
  # the Linux jobs run on the owner's local runner (podman, rootless, one job at a time);
  # the Windows jobs name their own tags and stay on the shared Windows runners
  tags: [local]
  interruptible: true

variables:
  DEBIAN_FRONTEND: noninteractive
  LIB_URL: https://gitlab.com/infraconsulting/python3-activitytrack

linux:
  stage: test
  # the distributions' packages only: the oldest and the newest of the targets
  image: $IMAGE
  parallel:
    matrix:
      - IMAGE: ["debian:trixie", "debian:forky", "ubuntu:24.04"]
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates python3 python3-cryptography python3-keyring flake8
    # the library (python3-activitytrack at .gitlab/lib-ref)
    - git clone --depth 1 -b "$(cat .gitlab/lib-ref)" "$LIB_URL" lib
    - export PYTHONPATH="$PWD/lib"
    - flake8 activitytrack_tui tests packaging/activitytrack-tui
    - python3 scripts/strings.py --check
    - python3 -m unittest discover -s tests -t . -v

windows:
  stage: test
  tags: [saas-windows-medium-amd64]
  # Windows only at the release (a version tag): the shared Windows runners are paid
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  script:
    - choco install python313 --no-progress -y
    - $env:Path = "C:\Python313;C:\Python313\Scripts;" + $env:Path
    # the versions the executable bundles (requirements-windows.txt)
    - python -m pip install -r requirements-windows.txt
    - python -m pip install windows-curses
    - $lib = (Get-Content .gitlab/lib-ref).Trim()
    - python -m pip install -c requirements-windows.txt "git+$env:LIB_URL@$lib"
    - python -m unittest discover -s tests -t . -v

# the Linux packages are built on a tag and in a pipeline started by hand or by the API
.packaging:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

deb:
  extends: .packaging
  stage: package
  image: $IMAGE
  parallel:
    matrix:
      - { IMAGE: "debian:trixie", SUFFIX: deb13 }
      - { IMAGE: "debian:forky", SUFFIX: deb14 }
      - { IMAGE: "ubuntu:24.04", SUFFIX: ubuntu24.04 }
      - { IMAGE: "ubuntu:26.04", SUFFIX: ubuntu26.04 }
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates git build-essential debhelper dpkg-dev devscripts equivs man-db
    # version
    - V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' activitytrack_tui/__init__.py)
    # a release is built on a released library
    - if [ -n "$CI_COMMIT_TAG" ]; then test "v$V" = "$CI_COMMIT_TAG"; grep -q "^v" .gitlab/lib-ref; fi
    # only the first "-": 0.9.4-beta5-1 is 0.9.4~beta5-1
    - DV=$(echo "$V" | sed 's/-/~/')
    # the package: that version and a Debian revision, 1.1.0~beta.1-1
    - PV=$(dpkg-parsechangelog -S Version)
    - test "$(dpkg-parsechangelog -S Source)" = activitytrack-tui && test "${PV%-*}" = "$DV" && test "$PV" != "$DV"
    - grep -q "activitytrack-tui $V" packaging/activitytrack-tui.1
    # the distribution goes in the revision: 1.1.0~beta.1-1~deb13 still satisfies (>= 1.1.0~beta.1)
    - sed -i "1s/($PV)/($PV~$SUFFIX)/" debian/changelog
    - head -1 debian/changelog
    # the library's package (python3-activitytrack at .gitlab/lib-ref)
    - git clone --depth 1 -b "$(cat .gitlab/lib-ref)" "$LIB_URL" /tmp/lib
    - cd /tmp/lib
    # versioned as in its release (1.1.0~beta.1-1~deb13): the Depends are tried on that
    - sed -i "1s/(\([^)]*\))/(\1~$SUFFIX)/" debian/changelog
    - mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
    - dpkg-buildpackage -b -us -uc
    - apt-get install -y /tmp/python3-activitytrack_*.deb
    - cd "$CI_PROJECT_DIR"
    # package
    - dpkg-buildpackage -b -us -uc
    - mkdir dist && mv ../activitytrack-tui_*.deb dist/
    - dpkg-deb --info dist/*.deb
    - dpkg-deb --contents dist/*.deb
    - apt-get install -y ./dist/*.deb
    # try it
    - activitytrack-tui --version
    - man -w activitytrack-tui
    # the tests against the installed code, not the checkout's
    - mkdir /tmp/t && cp -r tests /tmp/t/ && cd /tmp/t
    - PYTHONPATH=/usr/share/activitytrack-tui python3 -m unittest discover -s tests -t . -v
    - cd "$CI_PROJECT_DIR"
    # remove
    - apt-get purge -y activitytrack-tui
    - test ! -e /usr/share/activitytrack-tui && test ! -e /usr/bin/activitytrack-tui
  artifacts:
    paths: ["dist/*.deb"]
    expire_in: 30 days

tarball:
  extends: .packaging
  stage: package
  image: debian:trixie
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' activitytrack_tui/__init__.py)
    - mkdir dist
    - git archive --prefix="activitytrack-tui-$V/" -o "dist/activitytrack-tui-$V.tar.gz" HEAD
  artifacts:
    paths: ["dist/*.tar.gz"]
    expire_in: 30 days

windows-exe:
  stage: package
  # one executable for the console, with windows-curses; not signed (no costs: desktop's D10)
  tags: [saas-windows-medium-amd64]
  # Windows only at the release (a version tag): the shared Windows runners are paid
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  timeout: 30m
  script:
    - choco install python313 --no-progress -y
    - $env:Path = "C:\Python313;C:\Python313\Scripts;" + $env:Path
    - python -m pip install -r requirements-windows.txt -r requirements-build-windows.txt
    - python -m pip install windows-curses
    - $lib = (Get-Content .gitlab/lib-ref).Trim()
    - python -m pip install -c requirements-windows.txt "git+$env:LIB_URL@$lib"
    # installed, so that PyInstaller finds its data files (the translations)
    - python -m pip install --no-deps .
    - $V = (Select-String -Path activitytrack_tui/__init__.py -Pattern '^__version__ = "(.*)"').Matches[0].Groups[1].Value
    - if ($env:CI_COMMIT_TAG -and "v$V" -ne $env:CI_COMMIT_TAG) { throw "tag $env:CI_COMMIT_TAG, version $V" }
    - python -m unittest discover -s tests -t .
    - |
      pyinstaller --noconfirm --clean --onefile --console --name activitytrack-tui --paths . `
        --collect-submodules keyring.backends --collect-data tzdata `
        --collect-submodules activitytrack --collect-data activitytrack --collect-data activitytrack_tui `
        packaging/windows-launcher.py
    - .\dist\activitytrack-tui.exe --version
    - |
      if ($LASTEXITCODE -ne 0) { throw "version: $LASTEXITCODE" }
    - New-Item -ItemType Directory -Path pack | Out-Null
    - Copy-Item dist/activitytrack-tui.exe, LICENSE, README.md pack/
    - Compress-Archive -Path pack/* -DestinationPath "dist/activitytrack-tui-$V-windows.zip"
  artifacts:
    paths: ["dist/activitytrack-tui-*-windows.zip"]
    expire_in: 30 days

# the files go to the project's Generic Packages and the release links them
# (permalinks .../-/releases/<tag>/downloads/<file>); a version with a suffix is a beta
release:
  stage: release
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  interruptible: false
  script:
    - apk add --no-cache curl jq coreutils
    - V="${CI_COMMIT_TAG#v}"
    - PV=$(sed -n '1s/^[^(]*(\(.*\)).*/\1/p' debian/changelog)
    - R="${PV##*-}"
    - LIB=$(cat .gitlab/lib-ref)
    # "~" of the package versions is not allowed in a package file's name: "-" instead
    - mkdir artifacts && cp dist/*.deb dist/*.tar.gz dist/*.zip artifacts/
    - cd artifacts
    - for f in activitytrack-tui_*~*_all.deb; do mv "$f" "$(echo "$f" | tr '~' '-')"; done
    - sha256sum * > SHA256SUMS && cat SHA256SUMS
    - cd ..
    - |
      {
        case "$V" in *-*) echo "activitytrack-tui $V: a test release." ;; *) echo "activitytrack-tui $V." ;; esac
        echo
        echo "ActivityTrack in the terminal, full screen: the same application as ActivityTrack Desktop and the command line, on the same data and pairing."
        echo
        echo "- Debian 13 / 14, Ubuntu 24.04 / 26.04: \`apt install ./python3-activitytrack_*-<distro>_all.deb ./activitytrack-tui_${V}-${R}-<distro>_all.deb\`; the library [python3-activitytrack]($LIB_URL/-/releases/$LIB) is in its own release"
        echo "- Windows 10 / 11: `activitytrack-tui-$V-windows.zip`: `activitytrack-tui.exe`, to put in a folder of the PATH (Windows Terminal recommended). Not signed: check it against SHA256SUMS"
        echo "- Elsewhere: \`pip install activitytrack-tui-$V.tar.gz\` after the library"
      } > notes.md
    - |
      links='[]'
      for f in artifacts/*; do
        n=$(basename "$f")
        u="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/activitytrack-tui/$V/$n"
        curl --fail -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$u"
        links=$(echo "$links" | jq -c --arg n "$n" --arg u "$u" '. + [{name:$n, url:$u, direct_asset_path:("/"+$n), link_type:"package"}]')
      done
      jq -n --arg tag "$CI_COMMIT_TAG" --arg name "activitytrack-tui $V" --rawfile desc notes.md --argjson links "$links" \
        '{tag_name:$tag, name:$name, description:$desc, assets:{links:$links}}' |
        curl --fail-with-body -sS -X POST --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" --data @- "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
